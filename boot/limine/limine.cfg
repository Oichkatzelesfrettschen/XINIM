# Timeout in seconds before the default entry autoboots.
timeout: 1
serial: yes
verbose: yes

/XINIM x86_64
    protocol: limine
    path: boot():/boot/xinim
    module_path: boot():/bin/sh
    module_path: boot():/bin/true
    module_path: boot():/bin/echo
    module_path: boot():/bin/brk-check
    module_path: boot():/bin/preempt-check
    module_path: boot():/bin/mmap-check
    module_path: boot():/bin/fs-abi-check
    module_path: boot():/bin/runtime-check
    module_path: boot():/bin/signal-check
    module_path: boot():/bin/tty-abi-check
    module_path: boot():/bin/select-check
    module_path: boot():/bin/ipc-check
    module_path: boot():/bin/socket-check
    module_path: boot():/bin/file-operations-check
    module_path: boot():/bin/printf
    module_path: boot():/bin/rm
    module_path: boot():/bin/mkdir
    module_path: boot():/bin/bootfs-reuse-check
    module_path: boot():/bin/byte-oracle
    module_path: boot():/bin/printf-signal-oracle
    module_path: boot():/bin/mksh
    module_path: boot():/etc/mkshrc
    module_path: boot():/etc/motd

/XINIM x86_64 diagnostics
    protocol: limine
    path: boot():/boot/xinim
    cmdline: debug_shell staged_shell
    module_path: boot():/bin/sh
    module_path: boot():/bin/true
    module_path: boot():/bin/echo
    module_path: boot():/bin/brk-check
    module_path: boot():/bin/preempt-check
    module_path: boot():/bin/mmap-check
    module_path: boot():/bin/fs-abi-check
    module_path: boot():/bin/runtime-check
    module_path: boot():/bin/signal-check
    module_path: boot():/bin/tty-abi-check
    module_path: boot():/bin/select-check
    module_path: boot():/bin/ipc-check
    module_path: boot():/bin/socket-check
    module_path: boot():/bin/file-operations-check
    module_path: boot():/bin/printf
    module_path: boot():/bin/rm
    module_path: boot():/bin/mkdir
    module_path: boot():/bin/bootfs-reuse-check
    module_path: boot():/bin/byte-oracle
    module_path: boot():/bin/printf-signal-oracle
    module_path: boot():/bin/mksh
    module_path: boot():/etc/mkshrc
    module_path: boot():/etc/motd
