set timeout=0
set default=0
set gfxpayload=text

menuentry "XINIM i486" {
    multiboot2 /boot/xinim
    module2 /boot/xash /bin/xash
    module2 /boot/mksh /bin/mksh
    module2 /boot/holdsvc /bin/holdsvc
    module2 /boot/cat /bin/cat
    module2 /boot/ls /bin/ls
    module2 /boot/echo /bin/echo
    module2 /boot/motd /etc/motd
    boot
}
