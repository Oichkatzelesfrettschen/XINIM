name: i486 Changed C++ Analysis

on:
  workflow_call:

permissions:
  contents: read

jobs:
  clang-tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHON: /usr/bin/python3
      BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the matching Clang 22 analysis lane
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y clang-22 clang-tidy-22 libclang-rt-22-dev \
            libc++-22-dev libc++abi-22-dev libc6-dev-i386
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
          clang-tidy-22 --version

      - uses: actions/download-artifact@v4
        with:
          name: i486-analysis-inputs
          path: build/i486

      - name: Restore and relocate the build's analysis inputs
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON" - <<'PY'
          import json
          from pathlib import Path
          import shlex
          import subprocess
          import tarfile

          root = Path.cwd()
          build = root / "build/i486/Debug"
          build.mkdir(parents=True, exist_ok=True)
          with tarfile.open(build.parent / "analysis-inputs.tar.gz", "r:gz") as archive:
              archive.extractall(build, filter="data")
          manifest = json.loads((build / "analysis-provenance.json").read_text())
          checkout = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if checkout != manifest["checkout"]:
              raise SystemExit("Analysis checkout differs from the compiled source revision")
          compiler = subprocess.check_output(["clang++", "--version"], text=True)
          if compiler != manifest["compiler"]:
              raise SystemExit("Analysis compiler differs from the build compiler")
          previous_root = manifest["workspace"]

          def relocate(value):
              return value.replace(previous_root + "/", str(root) + "/")

          database_path = build / "compile_commands.json"
          entries = json.loads(database_path.read_text())
          for entry in entries:
              for field in ("directory", "file", "output"):
                  if field in entry:
                      entry[field] = relocate(entry[field])
              arguments = entry.get("arguments")
              if arguments is None:
                  arguments = shlex.split(entry.pop("command"))
              entry["arguments"] = [relocate(argument) for argument in arguments]
          database_path.write_text(json.dumps(entries, indent=2) + "\n")
          auxiliary = [build / "analysis-dependencies.txt"]
          auxiliary.extend((build / "CMakeFiles").rglob("*.modmap"))
          auxiliary.extend((build / "CMakeFiles").rglob("*.rsp"))
          for path in auxiliary:
              path.write_text(relocate(path.read_text()))
          PY

      - name: Analyze changed owned translation units with the repository policy
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON" - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          build = root / "build/i486/Debug"
          entries = json.loads((build / "compile_commands.json").read_text())
          dependencies = {}
          output = None
          for line in (build / "analysis-dependencies.txt").read_text().splitlines():
              if line and not line.startswith(" "):
                  output = None
                  if line.endswith("(VALID)"):
                      output = (build / line.split(": #deps ", 1)[0]).resolve()
                      dependencies[output] = set()
              elif line.startswith("    ") and output is not None:
                  dependencies[output].add(Path(line.strip()).resolve())
          # Analyze actual compiled configurations, including kernel and native variants.
          entries = [
              entry for entry in entries
              if Path(entry["output"]).resolve() in dependencies
          ]
          (build / "compile_commands.json").write_text(json.dumps(entries, indent=2) + "\n")
          sources = {
              Path(entry["file"]).resolve()
              for entry in entries
              if Path(entry["file"]).suffix in {".cpp", ".cc", ".cxx"}
              and Path(entry["file"]).resolve().is_relative_to(root)
              and Path(entry["file"]).resolve().relative_to(root).parts[0]
              in {"src", "include", "test"}
          }
          base = os.environ["BASE_REVISION"]
          head = os.environ["HEAD_REVISION"]
          if not base or set(base) == {"0"}:
              base = subprocess.check_output(
                  ["git", "rev-parse", f"{head}^"], text=True
              ).strip()
          comparison_base = subprocess.check_output(
              ["git", "merge-base", base, head], text=True
          ).strip()
          changed = {
              root / filename
              for filename in subprocess.check_output(
                  ["git", "diff", "-z", "--name-only", "--diff-filter=ACMR", comparison_base, head, "--"],
                  text=True,
              ).split("\0")
              if filename.startswith(("src/", "include/", "test/"))
          }
          changed_sources = {
              path for path in changed if path.suffix in {".cpp", ".cc", ".cxx"}
          }
          missing = sorted(changed_sources - sources)
          if missing:
              raise SystemExit("Changed sources lack completed build commands: " + ", ".join(map(str, missing)))
          selected = changed_sources & sources
          changed_headers = {path for path in changed if path.suffix in {".hpp", ".h"}}
          covered_headers = set()
          for entry in entries:
              source = Path(entry["file"]).resolve()
              if source not in sources:
                  continue
              dependent_headers = changed_headers & dependencies.get(
                  Path(entry["output"]).resolve(), set()
              )
              if dependent_headers:
                  selected.add(source)
                  covered_headers |= dependent_headers
          missing_headers = sorted(changed_headers - covered_headers)
          if missing_headers:
              raise SystemExit(
                  "Changed headers lack compiled consumers: "
                  + ", ".join(map(str, missing_headers))
              )
          if not selected:
              print("The change contains no compiled owned C++ source or interface.")
          for entry in entries:
              if Path(entry["file"]).resolve() not in selected:
                  continue
              for argument in entry["arguments"]:
                  if argument.startswith("@"):
                      response = Path(entry["directory"]) / argument[1:]
                      if not response.is_file():
                          raise SystemExit("Missing compile response file: " + str(response))
          failed = False
          for source in sorted(selected):
              command = [
                  "clang-tidy-22", "-p", str(build),
                  "--header-filter=" + re.escape(str(root)) + "/(src|include|test)/",
                  str(source),
              ]
              print("Running:", " ".join(command), flush=True)
              result = subprocess.run(command, check=False)
              failed |= result.returncode != 0
          raise SystemExit(1 if failed else 0)
          PY
