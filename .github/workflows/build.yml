name: Conan + CMake Build

on:
  push:
    branches: ["master", "main"]
  pull_request:

jobs:
  x86_64-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-21 \
            lld-21 \
            libc++-21-dev \
            libc++abi-21-dev \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            git \
            xorriso \
            grub-common \
            grub-pc-bin \
            mtools \
            qemu-system-x86
          python3 -m pip install "conan>=2.8,<3"

      - name: Configure Conan toolchain
        run: |
          conan install . \
            -pr:h=conan/profiles/clang-x86_64 \
            -s build_type=Debug \
            -o '&:lane=x86_64' \
            -of build/x86_64/Debug \
            --build=missing

      - name: Configure and build
        run: |
          cmake --preset x86_64-debug
          cmake --build --preset x86_64-debug

      - name: Run tests
        run: ctest --preset x86_64-debug

  i486-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install 32-bit lane dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-21 \
            lld-21 \
            libc++-21-dev \
            libc++abi-21-dev \
            libc6-dev-i386 \
            lib32gcc-s1 \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            git \
            xorriso \
            grub-common \
            grub-pc-bin \
            mtools \
            qemu-system-x86
          python3 -m pip install "conan>=2.8,<3"

      - name: Configure Conan toolchain
        run: |
          conan install . \
            -pr:h=conan/profiles/clang-x86_32 \
            -s build_type=Debug \
            -o '&:lane=i486' \
            -of build/i486/Debug \
            --build=missing

      - name: Configure and build
        run: |
          cmake --preset i486-debug
          cmake --build --preset i486-debug

      - name: Run tests
        run: ctest --preset i486-debug
