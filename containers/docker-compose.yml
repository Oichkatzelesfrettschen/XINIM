# XINIM Docker Compose Configuration
# Provides multi-container orchestration for development workflows
# Compatible with both Docker Compose and Podman Compose

services:
  # =============================================================================
  # Build Service - For compiling XINIM kernel
  # =============================================================================
  build:
    build:
      context: ..
      dockerfile: containers/Containerfile
      target: build-env
    image: xinim-build:local
    container_name: xinim-build
    volumes:
      - ..:/xinim:Z
    working_dir: /xinim
    command: bash -c "cmake --preset debug && cmake --build build/Debug"
    profiles:
      - build

  # =============================================================================
  # Test Service - For running test suites
  # =============================================================================
  test:
    build:
      context: ..
      dockerfile: containers/Containerfile
      target: test-env
    image: xinim-test:local
    container_name: xinim-test
    volumes:
      - ..:/xinim:Z
    working_dir: /xinim
    command: bash -c "cmake --preset debug && cmake --build build/Debug && ctest --output-on-failure --test-dir build/Debug -L unit"
    depends_on:
      - build
    profiles:
      - test

  # =============================================================================
  # Debug Service - Interactive debugging environment
  # =============================================================================
  debug:
    build:
      context: ..
      dockerfile: containers/Containerfile
      target: debug-env
    image: xinim-debug:local
    container_name: xinim-debug
    volumes:
      - ..:/xinim:Z
    working_dir: /xinim
    ports:
      - "1234:1234"  # GDB server port
    stdin_open: true
    tty: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    command: /bin/bash
    profiles:
      - debug

  # =============================================================================
  # QEMU Service - Boot kernel in QEMU emulator
  # =============================================================================
  qemu:
    build:
      context: ..
      dockerfile: containers/Containerfile
      target: test-env
    image: xinim-test:local
    container_name: xinim-qemu
    volumes:
      - ..:/xinim:Z
    working_dir: /xinim
    stdin_open: true
    tty: true
    command: >
      qemu-system-x86_64
        -kernel /xinim/build/Debug/xinim
        -nographic
        -no-reboot
        -m 512M
        -cpu qemu64
        -serial mon:stdio
    depends_on:
      - build
    profiles:
      - qemu

  # =============================================================================
  # QEMU Debug Service - Boot with GDB server for remote debugging
  # =============================================================================
  qemu-debug:
    build:
      context: ..
      dockerfile: containers/Containerfile
      target: debug-env
    image: xinim-debug:local
    container_name: xinim-qemu-debug
    volumes:
      - ..:/xinim:Z
    working_dir: /xinim
    ports:
      - "1234:1234"  # GDB server port
    stdin_open: true
    tty: true
    command: >
      qemu-system-x86_64
        -kernel /xinim/build/Debug/xinim
        -nographic
        -no-reboot
        -m 512M
        -cpu qemu64
        -serial mon:stdio
        -s -S
    profiles:
      - qemu-debug

  # =============================================================================
  # CI Service - Full CI pipeline
  # =============================================================================
  ci:
    build:
      context: ..
      dockerfile: containers/Containerfile
      target: ci-env
    image: xinim-ci:local
    container_name: xinim-ci
    volumes:
      - ..:/xinim:Z
    working_dir: /xinim
    command: |
      bash -c "
        set -e
        echo '=== Configuring Build ==='
        cmake --preset debug

        echo '=== Building XINIM ==='
        cmake --build build/Debug

        echo '=== Running Tests ==='
        ctest --output-on-failure --test-dir build/Debug -L unit || echo 'Some tests failed'

        echo '=== Running Lint ==='
        run-clang-tidy -p build/Debug || echo 'Lint completed with warnings'

        echo '=== CI Pipeline Complete ==='
      "
    profiles:
      - ci

  # =============================================================================
  # Lint Service - Code linting
  # =============================================================================
  lint:
    build:
      context: ..
      dockerfile: containers/Containerfile
      target: ci-env
    image: xinim-ci:local
    container_name: xinim-lint
    volumes:
      - ..:/xinim:Z
    working_dir: /xinim
    command: bash -c "cmake --preset debug && cmake --build build/Debug && run-clang-tidy -p build/Debug"
    profiles:
      - lint

  # =============================================================================
  # Format Service - Code formatting check
  # =============================================================================
  format:
    build:
      context: ..
      dockerfile: containers/Containerfile
      target: build-env
    image: xinim-build:local
    container_name: xinim-format
    volumes:
      - ..:/xinim:Z
    working_dir: /xinim
    command: bash -c "find src include -name '*.cpp' -o -name '*.hpp' -o -name '*.h' | xargs clang-format --dry-run --Werror"
    profiles:
      - format

  # =============================================================================
  # Coverage Service - Generate coverage reports
  # =============================================================================
  coverage:
    build:
      context: ..
      dockerfile: containers/Containerfile
      target: test-env
    image: xinim-test:local
    container_name: xinim-coverage
    volumes:
      - ..:/xinim:Z
    working_dir: /xinim
    command: |
      bash -c "
        cmake -B build/Coverage -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='--coverage' -DCMAKE_C_FLAGS='--coverage'
        cmake --build build/Coverage
        ctest --output-on-failure --test-dir build/Coverage -L unit
        python3 scripts/testing/coverage_heatmap.py --binary build/Coverage/xinim --profdata build/Coverage/default.profdata --output coverage-heatmap.html
      "
    profiles:
      - coverage

  # =============================================================================
  # Shell Service - Interactive development shell
  # =============================================================================
  shell:
    build:
      context: ..
      dockerfile: containers/Containerfile
      target: debug-env
    image: xinim-debug:local
    container_name: xinim-shell
    volumes:
      - ..:/xinim:Z
    working_dir: /xinim
    stdin_open: true
    tty: true
    command: /bin/bash
    profiles:
      - shell

# Networks
networks:
  default:
    name: xinim-network
